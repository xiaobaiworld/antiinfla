<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Sweet potatoes</title>
  <desc id="desc">Illustrated sweet potatoes on a warm background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff3e0"/><stop offset="100%" stop-color="#ffe0b2"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d84315"/><stop offset="100%" stop-color="#8d3312"/></linearGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffb74d"/><stop offset="100%" stop-color="#ff9800"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="650" rx="240" ry="35" fill="#ffcc80" opacity=".3"/>
  <ellipse cx="540" cy="440" rx="200" ry="80" fill="url(#skin)" transform="rotate(-8 540 440)"/>
  <ellipse cx="700" cy="500" rx="170" ry="65" fill="url(#skin)" transform="rotate(5 700 500)"/>
  <ellipse cx="700" cy="500" rx="50" ry="50" fill="url(#flesh)" transform="rotate(5 700 500)"/>
</svg>
