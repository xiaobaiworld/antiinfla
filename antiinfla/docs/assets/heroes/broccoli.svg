<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Fresh broccoli florets</title>
  <desc id="desc">Illustrated broccoli florets on a light green background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8ee"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <radialGradient id="floret" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="60%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="680" rx="200" ry="40" fill="#a5d6a7" opacity=".3"/>
  <rect x="560" y="520" width="80" height="180" rx="18" fill="#6d4c41" opacity=".85"/>
  <circle cx="600" cy="380" r="120" fill="url(#floret)"/>
  <circle cx="490" cy="420" r="90" fill="url(#floret)"/>
  <circle cx="710" cy="420" r="90" fill="url(#floret)"/>
  <circle cx="530" cy="340" r="75" fill="url(#floret)"/>
  <circle cx="670" cy="340" r="75" fill="url(#floret)"/>
  <circle cx="600" cy="300" r="65" fill="url(#floret)"/>
</svg>
