<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Kale leaves</title>
  <desc id="desc">Illustrated kale leaves on a green background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e8f5e9"/><stop offset="100%" stop-color="#c8e6c9"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#558b2f"/><stop offset="100%" stop-color="#1b5e20"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="660" rx="200" ry="30" fill="#a5d6a7" opacity=".3"/>
  <path d="M600 600 L580 500 C540 420, 440 380, 420 320 C400 260, 440 220, 500 240 C540 250, 560 300, 580 360" fill="url(#leaf)"/>
  <path d="M600 600 L620 500 C660 420, 760 380, 780 320 C800 260, 760 220, 700 240 C660 250, 640 300, 620 360" fill="url(#leaf)"/>
  <path d="M600 600 L600 460 C600 380, 560 300, 580 240 C600 200, 620 200, 620 240 C640 300, 600 380, 600 460" fill="#2e7d32" opacity=".7"/>
  <line x1="600" y1="600" x2="600" y2="240" stroke="#1b5e20" stroke-width="4" opacity=".4"/>
</svg>
