<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Opened pomegranate</title>
  <desc id="desc">Illustrated opened pomegranate showing seeds on a warm background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fce4ec"/><stop offset="100%" stop-color="#f8bbd0"/></linearGradient>
    <radialGradient id="skin" cx="50%" cy="45%" r="50%"><stop offset="0%" stop-color="#e53935"/><stop offset="100%" stop-color="#b71c1c"/></radialGradient>
    <radialGradient id="seed" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#ef9a9a"/><stop offset="100%" stop-color="#c62828"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="660" rx="200" ry="30" fill="#f48fb1" opacity=".25"/>
  <ellipse cx="600" cy="420" rx="180" ry="200" fill="url(#skin)"/>
  <ellipse cx="600" cy="420" rx="140" ry="160" fill="#ffebee"/>
  <g fill="url(#seed)"><circle cx="530" cy="360" r="14"/><circle cx="570" cy="340" r="13"/><circle cx="610" cy="350" r="14"/><circle cx="650" cy="340" r="13"/><circle cx="690" cy="360" r="14"/><circle cx="510" cy="400" r="13"/><circle cx="550" cy="390" r="14"/><circle cx="590" cy="385" r="13"/><circle cx="630" cy="390" r="14"/><circle cx="670" cy="400" r="13"/><circle cx="710" cy="410" r="14"/><circle cx="530" cy="440" r="14"/><circle cx="570" cy="430" r="13"/><circle cx="610" cy="425" r="14"/><circle cx="650" cy="430" r="13"/><circle cx="690" cy="440" r="14"/><circle cx="550" cy="475" r="13"/><circle cx="590" cy="468" r="14"/><circle cx="630" cy="470" r="13"/><circle cx="670" cy="478" r="14"/></g>
</svg>
