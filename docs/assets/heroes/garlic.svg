<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Garlic bulbs and cloves</title>
  <desc id="desc">Illustrated garlic bulbs and cloves on a light background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fafafa"/><stop offset="100%" stop-color="#eeeeee"/></linearGradient>
    <radialGradient id="bulb" cx="50%" cy="40%" r="55%"><stop offset="0%" stop-color="#f5f5f5"/><stop offset="60%" stop-color="#e0e0e0"/><stop offset="100%" stop-color="#bdbdbd"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="600" cy="650" rx="200" ry="30" fill="#e0e0e0" opacity=".3"/>
  <ellipse cx="550" cy="420" rx="120" ry="140" fill="url(#bulb)" stroke="#9e9e9e" stroke-width="3"/>
  <path d="M550 280 L540 310 L560 310Z" fill="#8d6e63"/>
  <line x1="500" y1="360" x2="550" y2="280" stroke="#bdbdbd" stroke-width="2" opacity=".5"/>
  <line x1="550" y1="340" x2="550" y2="280" stroke="#bdbdbd" stroke-width="2" opacity=".5"/>
  <line x1="600" y1="360" x2="550" y2="280" stroke="#bdbdbd" stroke-width="2" opacity=".5"/>
  <ellipse cx="720" cy="500" rx="45" ry="65" fill="url(#bulb)" stroke="#9e9e9e" stroke-width="2" transform="rotate(-15 720 500)"/>
  <ellipse cx="780" cy="520" rx="40" ry="58" fill="url(#bulb)" stroke="#9e9e9e" stroke-width="2" transform="rotate(10 780 520)"/>
</svg>
